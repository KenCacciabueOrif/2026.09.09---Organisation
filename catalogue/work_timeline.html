<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CaDa — Work Timeline</title>
<style>
/* Dark-first palette — zinc base, single indigo accent, teal secondary.
   All text ≥ WCAG AA on its background. */
:root{
  --bg:#0b0d10;          /* page */
  --surface:#12151a;     /* cards, tables */
  --surface-2:#181c23;   /* hover, inputs */
  --border:#252b35;
  --border-soft:#1c212a;
  --text:#e6e9ef;        /* 13.9:1 on bg */
  --text-2:#9aa3b2;      /* 6.1:1 on bg — secondary */
  --text-3:#6b7484;      /* 3.6:1 — decorative only */
  --accent:#818cf8;      /* indigo-400, 7.9:1 on bg */
  --accent-strong:#6366f1;
  --accent-dim:rgba(99,102,241,.14);
  --teal:#2dd4bf;
  --green:#4ade80; --blue:#60a5fa; --orange:#fb923c; --purple:#c084fc; --gray:#7d8590;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,'Segoe UI',Roboto,sans-serif;padding:28px 32px;max-width:1680px;margin:0 auto}
h1{font-size:22px;font-weight:650;letter-spacing:-.02em}
.sub{color:var(--text-2);font-size:13px;margin-top:2px}
a{color:var(--accent)}

/* tabs */
.tabs{display:flex;gap:4px;margin:20px 0 18px;border-bottom:1px solid var(--border);padding-bottom:0}
.tabs button{background:none;border:none;color:var(--text-2);padding:8px 14px 10px;cursor:pointer;font-size:13.5px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.tabs button:hover{color:var(--text)}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.panel{display:none}.panel.active{display:block}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:14px 16px}
.kpi b{font-size:24px;font-weight:650;display:block;color:var(--text);font-variant-numeric:tabular-nums}
.kpi span{color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:.6px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--text-2);text-align:left;font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border-soft);vertical-align:top}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
.num{font-variant-numeric:tabular-nums}

/* pills */
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--surface-2);color:var(--text-2)}
.pill.st-active{color:var(--green)}.pill.st-workspace{color:var(--blue)}
.pill.st-archived{color:var(--text-3)}.pill.st-paused{color:var(--orange)}.pill.st-infra{color:var(--purple)}
.pill::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px;background:currentColor;opacity:.9}

/* chart */
.chart{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px 18px 8px}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--text-2);font-size:12.5px;margin:12px 2px}
.legend .sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.spark{display:flex;align-items:flex-end;gap:3px;height:120px}
.spark div{flex:1;background:linear-gradient(180deg,var(--accent),var(--accent-strong));border-radius:3px 3px 0 0;min-width:4px;opacity:.9;transition:opacity .1s;cursor:default}
.spark div:hover{opacity:1;box-shadow:0 0 0 1px var(--teal)}
#sparkcap,#hm-labels{color:var(--text-3);font-size:11.5px;padding:8px 2px;display:flex;justify-content:space-between}
.axis{display:flex;gap:3px;color:var(--text-3);font-size:10.5px;margin-top:4px}
.axis span{flex:1;text-align:center;min-width:0;overflow:visible;white-space:nowrap}

/* filters */
.filters{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.filters select,.filters input[type=text]{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;outline:none}
.filters select:focus,.filters input:focus{border-color:var(--accent)}
.filters label{color:var(--text-2);font-size:12.5px;display:flex;align-items:center;gap:6px;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent-strong)}
.count{color:var(--text-3);font-size:12px;margin-left:auto}

/* detail drawer */
#detail{position:fixed;inset:0;background:rgba(4,6,9,.6);display:none;z-index:9;backdrop-filter:blur(2px)}
#detail-card{position:fixed;right:0;top:0;bottom:0;width:400px;max-width:92vw;background:var(--surface);border-left:1px solid var(--border);padding:22px;overflow:auto;display:none;z-index:10}
#detail-card h3{font-size:16px;margin-bottom:2px}
.k{color:var(--text-3);font-size:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:12px 0;font-size:13px}
.kv .k{padding-top:1px}
#detail-card .x{position:absolute;top:14px;right:16px;cursor:pointer;color:var(--text-3);font-size:18px;line-height:1}
#detail-card .x:hover{color:var(--text)}
.commit-line{font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--border-soft);display:flex;gap:10px}
.commit-line .d{color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.section-label{color:var(--text-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}

.bar{display:inline-block;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--accent-strong),var(--accent));vertical-align:middle;margin-right:8px}
.langs{color:var(--text-3);font-size:12px;font-family:ui-monospace,monospace}
.empty{color:var(--text-3);padding:24px;text-align:center}
.note{color:var(--text-2);font-size:12.5px;margin-bottom:12px}
.toprepos b{color:var(--text);font-weight:550}
.toprepos span{color:var(--text-3)}

/* data-quality strip */
.dq{margin:8px 0 0;font-size:12px;color:var(--text-2)}
.dq b{color:var(--text)}
.dq .warn{color:var(--orange);font-weight:500}
.dq .ok{color:var(--green)}

/* granularity switch */
.gsw{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px;padding:2px;margin-left:8px;vertical-align:middle}
.gsw button{background:none;border:none;color:var(--text-2);padding:3px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500}
.gsw button.on{background:var(--accent-dim);color:var(--accent)}
/* focus view */
.tree{margin-top:12px}
.prow{border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--surface);margin-bottom:8px;overflow:hidden}
.prow-h{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}
.prow-h:hover{background:var(--surface-2)}
.prow-h b{min-width:180px}
.prow-h .cnt{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
.prow-h .rng{color:var(--text-3);font-size:12px}
.prow-h .mini{display:flex;gap:2px;align-items:flex-end;height:22px;margin-left:auto}
.prow-h .mini i{width:4px;background:var(--accent);opacity:.7;border-radius:1px}
.kids{display:none;border-top:1px solid var(--border-soft)}
.prow.open .kids{display:block}
.kid{display:flex;gap:12px;padding:7px 14px 7px 28px;font-size:13px;border-bottom:1px solid var(--border-soft);cursor:pointer}
.kid:hover{background:var(--surface-2)}
.kid .rng{color:var(--text-3)}
.kid .n{font-variant-numeric:tabular-nums;color:var(--text-2)}
/* pagination + commit groups */
.grp td{background:var(--surface-2);color:var(--text-2);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:5px 10px}
.more{margin-top:10px;text-align:center}
.more button{background:var(--surface-2);border:1px solid var(--border);color:var(--accent);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:12.5px}
.more button:hover{border-color:var(--accent)}
/* calendar heatmap */
.calwrap{display:flex;gap:8px}
.calwds{display:grid;grid-template-rows:repeat(7,13px);gap:2px;color:var(--text-3);font-size:9.5px}
.calwds span{line-height:13px}
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;gap:2px}
.cal i{width:13px;height:13px;border-radius:2px;background:var(--surface-2);cursor:default}
.cal i:hover{outline:1px solid var(--teal)}
.calmons{position:relative;height:14px;color:var(--text-3);font-size:10px;margin-bottom:3px}
.calmons span{position:absolute;white-space:nowrap}
/* quick actions */
.qa{display:inline-flex;gap:6px}
.qa a{color:var(--text-2);text-decoration:none;font-size:12px;border:1px solid var(--border);border-radius:6px;padding:2px 7px}
.qa a:hover{color:var(--accent);border-color:var(--accent)}
th[aria-sort]{color:var(--text-2)}
th .sg{color:var(--accent);font-size:10px;margin-left:3px}
th[data-s]{cursor:pointer}
/* recent strip */
.recent{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:20px}
.recent .kpi{border-left:3px solid var(--accent)}
.recent .kpi b{font-size:18px}
/* shared tooltip */
#tip{position:fixed;z-index:20;background:#1e2430;border:1px solid var(--border);color:var(--text);font-size:12px;line-height:1.45;padding:7px 10px;border-radius:8px;pointer-events:none;display:none;white-space:pre;box-shadow:0 6px 20px rgba(0,0,0,.45);max-width:320px;white-space:pre-line}
/* density */
body.compact td{padding:4px 10px}
body.compact .kpi{padding:10px 14px}
/* fatal error panel */
.fatal{border:1px solid var(--orange);border-radius:var(--radius);background:var(--surface);padding:14px 16px;margin:14px 0;color:var(--text)}
.fatal b{color:var(--orange)}
</style>
</head>
<body>
<div style="display:flex;align-items:flex-start;gap:12px">
<h1>Work Timeline</h1>
<input type="text" id="g-search" placeholder="Search everything… ( / )"
  style="margin-left:auto;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 12px;font-size:13px;width:280px;outline:none">
<button id="density" title="Toggle compact density" style="background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px">Compact: off</button>
</div>
<div class="sub" id="gen"></div>
<div id="tip" role="tooltip"></div>
<div class="dq" id="dq" role="status" aria-live="polite"></div>
<div class="tabs" role="tablist">
  <button class="active" data-p="overview" role="tab" aria-controls="overview">Overview</button>
  <button data-p="projects" role="tab" aria-controls="projects">Projects</button>
  <button data-p="commits" role="tab" aria-controls="commits">Commit log</button>
  <button data-p="heatmap" role="tab" aria-controls="heatmap">Activity</button>
  <button data-p="focus" role="tab" aria-controls="focus">Focus</button>
</div>

<div class="panel active" id="overview" role="tabpanel">
  <div class="kpis" id="kpis"></div>
  <div class="recent" id="recent"></div>
  <div class="chart">
    <div class="note" style="margin-bottom:6px">Commits per month — your commits only<span class="gsw" id="gsw"><button data-g="Y">Year</button><button data-g="M" class="on">Month</button><button data-g="W">Week</button></span></div>
    <div class="spark" id="spark"></div>
    <div class="axis" id="axis"></div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="section-label">Top-level map · C:\Project</div>
  <table id="tops"><thead><tr><th>Folder</th><th>Status</th><th class="num" style="text-align:right">Files</th><th class="num" style="text-align:right">Size</th></tr></thead><tbody></tbody></table>
</div>

<div class="panel" id="projects" role="tabpanel">
  <div class="filters">
    <select id="f-status"><option value="">All statuses</option><option>active</option><option>workspace</option><option>archived</option><option>paused</option><option>infra</option></select>
    <select id="f-kind"><option value="">Git + folders</option><option value="git">Git only</option><option value="folder">Folders only</option></select>
    <label><input type="checkbox" id="f-own" checked> Only projects with my commits</label>
    <input type="text" id="f-q" placeholder="Search project…">
    <button id="f-clear" style="background:none;border:1px solid var(--border);color:var(--text-2);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px">Clear</button>
    <span class="count" id="p-count" aria-live="polite"></span>
  </div>
  <table id="ptable"><thead><tr>
    <th data-s="name">Project</th><th data-s="status">Status</th>
    <th data-s="own_commits" data-num="1">My commits</th>
    <th data-s="own_first_commit">First</th><th data-s="own_last_commit">Last</th>
    <th data-s="files" data-num="1">Files</th><th>Languages</th><th></th></tr></thead><tbody></tbody></table>
</div>

<div class="panel" id="commits" role="tabpanel">
  <div class="filters">
    <select id="c-repo"><option value="">All repos</option></select>
    <label><input type="checkbox" id="c-own" checked> Only my commits</label>
    <input type="text" id="c-q" placeholder="Search subject…">
    <button id="c-clear" style="background:none;border:1px solid var(--border);color:var(--text-2);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px">Clear</button>
    <span class="count" id="c-count" aria-live="polite"></span>
  </div>
  <table id="ctable"><thead><tr><th>Date</th><th>Repo</th><th>Subject</th><th>Author</th></tr></thead><tbody></tbody></table>
  <div class="more"><button id="c-more">Load 200 older commits</button></div>
</div>

<div class="panel" id="heatmap" role="tabpanel">
  <div class="chart">
    <div class="note" style="margin-bottom:10px">Commit calendar — last 12 months, one square per day (hover for detail)</div>
    <div class="calwrap">
      <div class="calwds" id="calwds"></div>
      <div style="flex:1;overflow-x:auto">
        <div class="calmons" id="calmons"></div>
        <div class="cal" id="cal"></div>
      </div>
    </div>
  </div>
  <div class="legend toprepos" style="margin-top:16px">Top repos by your commits: <span id="toprepos"></span></div>
</div>


<div class="panel" id="focus" role="tabpanel">
  <div class="filters">
    <select id="fo-period"></select>
    <label><input type="checkbox" id="fo-own" checked> Only projects with my commits</label>
    <span class="count" id="fo-count"></span>
  </div>
  <div class="tree" id="ftree"></div>
</div>

<div id="detail" onclick="if(event.target===this)closeDetail()"></div>
<div id="detail-card" tabindex="-1"><span class="x" role="button" tabindex="0" aria-label="Close" onclick="closeDetail()" onkeydown="if(event.key==='Enter')closeDetail()">✕</span><div id="detail-body"></div></div>

<script>
window.addEventListener('error',e=>{
  const dq=document.getElementById('dq');
  if(dq)dq.innerHTML='<span class="warn">⚠ script error — page may be partially rendered: '+String(e.message).replace(/[<>]/g,'')+'</span>';
});

function showDataFatal(msg){
  const tip = location.protocol==='file:'
    ? ' Ensure <code>work_timeline_data.js</code> sits next to this HTML (run the generator), or open via a local HTTP server.'
    : ' Serve the <code>catalogue/</code> folder over HTTP and ensure <code>work_timeline_data.json</code> exists (run the generator).';
  document.body.insertAdjacentHTML('afterbegin',
    '<div class="fatal"><b>Data load error</b> — '+String(msg).replace(/[<>]/g,'')+'.'+tip+'</div>');
}

function loadDataScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('Failed to load '+src));
    document.head.appendChild(s);
  });
}

async function loadTimelineData(){
  const isFile = location.protocol==='file:';
  if(window.__WORK_TIMELINE_DATA__){
    return {data:window.__WORK_TIMELINE_DATA__, source:'module', loadedAt:new Date()};
  }
  if(isFile){
    await loadDataScript('./work_timeline_data.js');
    if(!window.__WORK_TIMELINE_DATA__)
      throw new Error('Data module loaded but window.__WORK_TIMELINE_DATA__ is missing');
    return {data:window.__WORK_TIMELINE_DATA__, source:'module', loadedAt:new Date()};
  }
  // http(s): prefer canonical JSON fetch
  try{
    const t0 = (typeof performance!=='undefined' && performance.now) ? performance.now() : Date.now();
    const resp = await fetch('./work_timeline_data.json');
    if(!resp.ok) throw new Error('HTTP '+resp.status+' fetching work_timeline_data.json');
    const data = await resp.json();
    const t1 = (typeof performance!=='undefined' && performance.now) ? performance.now() : Date.now();
    return {data, source:'fetch', loadedAt:new Date(), fetchMs:Math.round(t1-t0)};
  }catch(fetchErr){
    try{
      if(!window.__WORK_TIMELINE_DATA__) await loadDataScript('./work_timeline_data.js');
      if(window.__WORK_TIMELINE_DATA__){
        return {data:window.__WORK_TIMELINE_DATA__, source:'module-fallback', loadedAt:new Date(),
          fetchError:String(fetchErr && fetchErr.message || fetchErr)};
      }
    }catch(_){ /* fall through */ }
    throw fetchErr;
  }
}

let D;
let loadMeta;

async function boot(){
  try{
    const pack = await loadTimelineData();
    D = pack.data;
    loadMeta = pack;
  }catch(err){
    showDataFatal(err && err.message ? err.message : err);
    return;
  }
  try{
    initApp();
  }catch(err){
    showDataFatal('init failed: '+(err && err.message ? err.message : err));
    const dq=document.getElementById('dq');
    if(dq)dq.innerHTML='<span class="warn">⚠ init error after data load</span>';
  }
}

function initApp(){
/* --- dedupe + hierarchy (repo families) --- */
/* Generator already dedupes by commit hash; the in-view pass below only
   guards against same-day same-subject re-commits within one repo PATH
   (keyed by path, not name — several corpus copies share a repo name). */
const seen = new Set();
const commitsD = D.commits.filter(c => {
  const k = (c.path||c.repo)+'|'+c.date+'|'+c.subject;
  if (c.own && seen.has(k)) return false;
  if (c.own) seen.add(k);
  return true;
});
const ownD = commitsD.filter(c=>c.own);
D.dupRemoved = D.commits.length - commitsD.length;

/* family = repo path minus the last segment; wrapper folders (archive/, paused/, date-folders) collapse upward */
const WRAP = /^(archive|paused)$/i;
function familyOf(r){
  const seg = r.path.replace(/\\/g,'/').split('/');
  seg.shift(); // drop C:
  seg.shift(); // drop Project
  while (seg.length > 1 && (WRAP.test(seg[0]) || /^\d{4}\.\d{2}\.\d{2} - /.test(seg[0]))) seg.shift();
  seg.pop(); // repo leaf
  return seg.join('/');
}
/* merge same-named repo instances (variants share commit identity in the data) */
const byName = {};
D.repos.forEach(r => {
  if (byName[r.name]) {
    const t = byName[r.name];
    t.files += r.files||0; t.size_bytes += r.size_bytes||0;
    t.own_commits += r.own_commits||0; t.commit_count += r.commit_count||0;
    if (!t.own_first_commit || (r.own_first_commit && r.own_first_commit < t.own_first_commit)) t.own_first_commit = r.own_first_commit;
    if (!t.own_last_commit || (r.own_last_commit && r.own_last_commit > t.own_last_commit)) t.own_last_commit = r.own_last_commit;
    t.variants = (t.variants||1) + 1;
  } else byName[r.name] = r;
});
D.reposM = Object.values(byName);
const famOf = {}; D.repos.forEach(r => famOf[r.name] = familyOf(r));
const families = {};
D.reposM.forEach(r => { const f = familyOf(r) || '(root)'; (families[f] = families[f] || []).push(r); });

const own = ownD;  // deduped
document.getElementById('gen').textContent =
  `${D.generated} · ${D.repos.length} projects · ${own.length} own commits of ${D.commits.length} total (rest is upstream history)`;

/* helpers */
const fmtSize = b => b>1e9?(b/1e9).toFixed(1)+' GB':b>1e6?(b/1e6).toFixed(1)+' MB':b>1e3?Math.round(b/1e3)+' KB':b+' B';
/* --- deep linking: tabs + filters in URL --- */
function syncUrl(){
  const u = new URL(location);
  u.hash = document.querySelector('.tabs button.active').dataset.p;
  const q = new URLSearchParams();
  ['f-status','f-kind','f-q','c-repo','c-q'].forEach(id => { const v = fEl(id).value; if (v) q.set(id, v); });
  if (!fEl('f-own').checked) q.set('f-own','0');
  if (!fEl('c-own').checked) q.set('c-own','0');
  u.search = q.toString();
  history.replaceState(null, '', u);
}
function applyUrl(){
  const q = new URLSearchParams(location.search);
  q.forEach((v,k) => { if (fEl(k)) { fEl(k).value = v; } });
  if (q.get('f-own') === '0') fEl('f-own').checked = false;
  if (q.get('c-own') === '0') fEl('c-own').checked = false;
  const h = location.hash.slice(1);
  if (h && document.getElementById(h) && document.querySelector(`.tabs button[data-p="${h}"]`))
    document.querySelector(`.tabs button[data-p="${h}"]`).click();
}
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  const b = h && document.querySelector(`.tabs button[data-p="${h}"]`);
  if (b && !b.classList.contains('active')) b.click();
});

const esc = s => (s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pill = s => `<span class="pill st-${s}">${s}</span>`;
const fEl = id => document.getElementById(id);

/* --- data quality / observability --- */
const DQ = (() => {
  const gen = new Date(D.generated.replace(' ', 'T'));
  const ageDays = (Date.now() - gen) / 864e5;
  const issues = [], stats = {};
  if (ageDays > 7) issues.push(`data is ${Math.floor(ageDays)}d old (generated ${D.generated})`);
  // validity checks
  const badDate = ownD.filter(c => !/^\d{4}-\d{2}-\d{2}/.test(c.date)).length;
  if (badDate) issues.push(`${badDate} own commits with malformed dates`);
  const noRepo = ownD.filter(c => !c.repo || !D.repos.some(r => r.name === c.repo)).length;
  if (noRepo) issues.push(`${noRepo} own commits referencing unknown repos`);
  const dupKeys = new Set(); let dups = 0;
  ownD.forEach(c => { const k = (c.path||c.repo) + '|' + c.date + '|' + c.subject; if (dupKeys.has(k)) dups++; dupKeys.add(k); });
  if (dups) issues.push(`${dups} duplicate commit entries`);
  if (D.dupRemoved) issues.push(`${D.dupRemoved} same-day same-subject re-commits collapsed (distinct commits, informational)`);
  const span = D.commits.length ? (ownD.length / D.commits.length * 100).toFixed(0) : 0;
  stats.coverage = `${ownD.length}/${D.commits.length} own (${span}%), ${D.dupRemoved} dups suppressed`;
  stats.repos = `${D.repos.length} repos, ${D.repos.filter(r => r.kind === 'git').length} git`;
  return { ageDays, issues, stats };
})();

function renderFocus(){
  const sel=document.getElementById('fo-period');
  if(!sel.options.length){
    sel.innerHTML='<option value="all">All time</option>';
    [...new Set(ownD.map(c=>c.date.slice(0,4)))].sort().reverse().forEach(y=>{
      const o=document.createElement('option');o.value=y;o.textContent='Year '+y;sel.appendChild(o);});
    [...new Set(ownD.map(c=>c.date.slice(0,7)))].sort().reverse().forEach(m=>{
      const o=document.createElement('option');o.value=m;o.textContent='Month '+m;sel.appendChild(o);});
    const ws=new Set(ownD.map(c=>{const d=new Date(c.date+'T00:00:00');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10);}));
    [...ws].sort().reverse().forEach(w=>{
      const o=document.createElement('option');o.value=w;o.textContent='Week of '+w;sel.appendChild(o);});
  }
  const per=sel.value;
  const inPer=c=>per==='all'||(per.length===4?c.date.startsWith(per):per.length===7?c.date.slice(0,7)===per:weekOf(c.date)===per);
  function weekOf(d){const x=new Date(d+'T00:00:00');x.setUTCDate(x.getUTCDate()-((x.getUTCDay()+6)%7));return x.toISOString().slice(0,10);}
  const ownOnly=document.getElementById('fo-own').checked;
  // aggregate per repo within period
  const perRepo={};
  ownD.filter(inPer).forEach(c=>{perRepo[c.repo]=(perRepo[c.repo]||0)+1;});
  const famAgg={};
  const fams={};
  Object.entries(families).forEach(([f,rs])=>{
    const _byName={};
    rs.forEach(r=>{_byName[r.name]=_byName[r.name]||{r,n:0};_byName[r.name].n+=perRepo[r.name]||0;});
    const kids=Object.values(_byName).filter(k=>k.n>0||!ownOnly);
    if(!kids.length)return;
    const tot=kids.reduce((a,k)=>a+k.n,0);
    if(ownOnly&&tot===0)return;
    const dates=ownD.filter(c=>inPer(c)&&perRepo[c.repo]).map(c=>c.date).sort();
    fams[f]={kids:kids.sort((a,b)=>b.n-a.n),tot};
  });
  const order=Object.entries(fams).sort((a,b)=>b[1].tot-a[1].tot);
  document.getElementById('fo-count').textContent=`${order.length} project groups · ${order.reduce((a,[,f])=>a+f.tot,0)} commits in period`;
  document.getElementById('ftree').innerHTML=order.map(([f,fam])=>{
    const maxK=Math.max(1,...fam.kids.map(k=>k.n));
    const dates=ownD.filter(c=>inPer(c)&&fam.kids.some(k=>k.r.name===c.repo)).map(c=>c.date).sort();
    const rng=dates.length?dates[0]+' → '+dates[dates.length-1]:'—';
    return `<div class="prow">
      <div class="prow-h" role="button" tabindex="0" onclick="this.parentNode.classList.toggle('open')">
        <b>${esc(f||'(root projects)')}</b>
        <span class="cnt">${fam.tot}</span>
        <span class="rng">${rng}</span>
        <span class="mini">${fam.kids.slice(0,26).map(k=>`<i style="height:${Math.max(8,k.n/maxK*100)}%" title="${esc(k.r.name)}: ${k.n}"></i>`).join('')}</span>
      </div>
      <div class="kids">${fam.kids.map(k=>`
        <div class="kid" role="button" tabindex="0" data-repo="${esc(k.r.name)}" onclick="showDetail(${repoIdx[k.r.name]})">
          <b>${esc(k.r.name)}</b>${k.r.status?pill(k.r.status):''}
          <span class="n">${k.n} commit${k.n===1?'':'s'}</span>
          <span class="rng">${k.r.own_first_commit||'—'} → ${k.r.own_last_commit||'—'}</span>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('') || '<div class="empty" style="padding:20px">No activity in this period</div>';
}

/* time buckets: year / month / week */
function buckets(g){
  const b={};
  own.forEach(c=>{
    let k;
    if(g==='Y') k=c.date.slice(0,4);
    else if(g==='W'){const d=new Date(c.date+'T00:00:00');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));k=d.toISOString().slice(0,10);}
    else k=c.date.slice(0,7);
    (b[k]=b[k]||{n:0,ex:{}});
    b[k].n++;b[k].ex[c.repo]=(b[k].ex[c.repo]||0)+1;
  });
  return b;
}
let curG='M';
function renderSpark(){
  const b=buckets(curG), mk=Object.keys(b).sort(), maxN=Math.max(...mk.map(m=>b[m].n));
  const bars=mk.map(m=>{
    const ex=Object.entries(b[m].ex).sort((x,y)=>y[1]-x[1]).slice(0,4).map(([r,n])=>r+'('+n+')').join(', ');
    return `<div style="height:${Math.max(2,b[m].n/maxN*100)}%" title="${m} — ${b[m].n} commits\n${ex}"></div>`;
  }).join('');
  const step=Math.max(1,Math.ceil(mk.length/16));
  const ax=mk.map((m,i)=>`<span>${(i%step===0||i===mk.length-1)?m.slice(curG==='Y'?2:0):''}</span>`).join('');
  return [bars, ax];
}

    if(projHit&&!comHit)panel='projects';
    const btn=document.querySelector(`.tabs button[data-p="${panel}"]`);
    if(btn)btn.click();
    if(panel==='projects'){const fq=document.getElementById('f-q');fq.value=gs.value;fq.dispatchEvent(new Event('input',{bubbles:true}));fq.focus();}
    else{const cq=document.getElementById('c-q');cq.value=gs.value;cq.dispatchEvent(new Event('input',{bubbles:true}));cq.focus();}
  });
})();

/* expose for inline onclick handlers in static HTML / generated rows */
window.showDetail = showDetail;
window.closeDetail = closeDetail;
window.clearProjFilters = clearProjFilters;
window.clearCommitFilters = clearCommitFilters;
}

boot();
</script>
